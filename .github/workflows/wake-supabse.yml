name: Wake Supabase

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase
        run: |
          curl "${{ secrets.SUPABASE_URL }}/rest/v1/your_table?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
